<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Browse Halo achievement lists and guides for MCC, Halo 5, Halo Infinite, Halo Wars: Definitive Edition, Spartan Strike, Spartan Assault, and Halo: Campaign Evolved."
    >
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050708">
    <title>Halo Achievement Tracker</title>
    <link rel="icon" href="assets/app.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <video
      class="app-background"
      aria-hidden="true"
      autoplay
      loop
      muted
      playsinline
      poster="assets/background-mcc.jpg"
    >
      <source src="assets/background.mp4" type="video/mp4">
    </video>

    <div class="app-shell">
      <header class="app-header">
        <button
          class="icon-button menu-button"
          id="menu-toggle"
          type="button"
          aria-controls="primary-navigation"
          aria-expanded="false"
          aria-label="Open navigation"
        >
          <img src="assets/list.svg" alt="" width="24" height="24">
        </button>

        <a class="brand" href="?page=search" data-route>
          <img src="assets/app.svg" alt="" width="32" height="32">
          <span>Halo Achievement Tracker</span>
        </a>
      </header>

      <div class="sidebar" id="primary-navigation">
        <nav class="navigation" aria-label="Primary">
          <a class="nav-item" href="?page=search" data-route data-page="search">
            <img src="assets/house.svg" alt="" width="24" height="24">
            <span>Home</span>
          </a>

          <button
            class="nav-item nav-section-toggle"
            id="achievements-toggle"
            type="button"
            aria-controls="game-navigation"
            aria-expanded="true"
          >
            <img src="assets/achievements.svg" alt="" width="24" height="24">
            <span>Achievements</span>
            <img class="nav-chevron" src="assets/chevron-down.svg" alt="" width="20" height="20">
          </button>

          <ul class="game-navigation" id="game-navigation">
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halomcc"
                data-route
                data-page="achievements"
                data-game="halomcc"
              >
                <img src="assets/halo-mcc.png" alt="" width="32" height="32">
                <span>Halo MCC (All)</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=haloreach"
                data-route
                data-page="achievements"
                data-game="haloreach"
              >
                <img src="assets/halo-reach.png" alt="" width="32" height="32">
                <span>Halo Reach</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=haloce"
                data-route
                data-page="achievements"
                data-game="haloce"
              >
                <img src="assets/halo-ce.png" alt="" width="32" height="32">
                <span>Halo CE</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halo2"
                data-route
                data-page="achievements"
                data-game="halo2"
              >
                <img src="assets/halo-2.png" alt="" width="32" height="32">
                <span>Halo 2</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halo3"
                data-route
                data-page="achievements"
                data-game="halo3"
              >
                <img src="assets/halo-3.png" alt="" width="32" height="32">
                <span>Halo 3</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halo3odst"
                data-route
                data-page="achievements"
                data-game="halo3odst"
              >
                <img src="assets/halo-3-odst.png" alt="" width="32" height="32">
                <span>Halo 3 ODST</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halo4"
                data-route
                data-page="achievements"
                data-game="halo4"
              >
                <img src="assets/halo-4.png" alt="" width="32" height="32">
                <span>Halo 4</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halo5"
                data-route
                data-page="achievements"
                data-game="halo5"
              >
                <img src="assets/halo-5.png" alt="" width="32" height="32">
                <span>Halo 5</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=haloinfinite"
                data-route

                <span>Halo Wars: DE</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halospartanstrike"
                data-route
                data-page="achievements"
                data-game="halospartanstrike"
              >
                <img src="assets/halospartanstrike.png" alt="" width="32" height="32">
                <span>Halo: Spartan Strike</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halospartanassault"

                data-page="achievements"

                <span>Halo: Spartan Assault</span>
              </a>
            </li>
            <li>
              <a
                class="nav-item nav-game"
                href="?page=achievements&amp;game=halocampaignevolved"

                data-page="achievements"

                <img src="assets/halocampaignevolved.png" alt="" width="32" height="32">
                <span>Halo: Campaign Evolved</span>

          <a
            class="nav-item nav-settings"
            href="?page=settings"
            data-route
            data-page="settings"
          >
            <img src="assets/settings.svg" alt="" width="24" height="24">
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <button
        class="drawer-backdrop"
        id="drawer-backdrop"
        type="button"
        aria-label="Close navigation"
        tabindex="-1"
      ></button>

      <main class="main-content" id="main-content" tabindex="-1">
        <div class="route-view" id="route-view">
          <p class="loading-message">Loading achievements...</p>
        </div>
      </main>
    </div>

    <template id="release-notes-template">
      <section class="release-notes-page surface" aria-labelledby="release-notes-title">
        <header class="release-notes-heading">
          <h1 id="release-notes-title">Release Notes</h1>
          <a href="?page=settings" data-route>Back to Settings</a>
        </header>
        <section class="release-entry surface">
          <h2>Version 1.1.0 (2026/11/22)</h2>
          <ul>
            <li>Added Achievements for Halo Wars: Definitive Edition (75)</li>
            <li>Added Achievements for Halo: Spartan Strike (20)</li>
            <li>Added Achievements for Halo: Spartan Assault (25)</li>
            <li>Added Achievements for Halo: Campaign Evolved (58)</li>
            <li>Added Game Icons with Transparent Backgrounds for all four games</li>
            <li>Improved Responsiveness, Keyboard Navigation, and Color Contrast</li>
            <li>Improved the Language Dropdown in Settings</li>
            <li>Added the Release Notes page to the website</li>
          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.8 (2024/05/24)</h2>
          <ul>
            <li>Added Achievement Guides in Halo MCC for:
              <ul>
                <li>My Buddy Chips</li>
                <li>I Need A Weapon</li>
                <li>To War</li>
                <li>Halo</li>
                <li>Standard Operating Brocedure</li>
                <li>You Flew Pretty Good</li>
                <li>Truth and Reconciliation</li>
                <li>Into The Howling Dark</li>
              </ul>
            </li>
            <li>Improved Responsiveness</li>
            <li>Improved Search Engine Optimization</li>
          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.7 (2024/04/06)</h2>
          <ul>
            <li>Added Achievement Guides in Halo MCC for:
              <ul>
                <li>We&rsquo;re Just Getting Started</li>
                <li>Just A Taste</li>
                <li>Protocol Dictates Action</li>
                <li>Stick With It&hellip;A Little Longer</li>
                <li>Pillar of Autumn</li>
                <li>The Guardians Are Coming</li>
                <li>All Out of Bubblegum</li>
                <li>A Pile of Medals</li>
                <li>A Crate of Medals</li>
                <li>A Heap of Medals</li>
                <li>A Few Trinkets</li>
                <li>Oh, These Baubles?</li>
                <li>Chesty Puller Starter Kit</li>
                <li>Medal Master Chief</li>
                <li>The Good, The Bad, and The Dead</li>
                <li>Medal Completionist</li>
              </ul>
            </li>
            <li>Improved Achievement Filters</li>
          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.6 (2024/04/04)</h2>
          <p><img src="assets/release-notes/v1-0-6-achievements.webp" alt="Achievements Page for Halo Achievement Tracker (HaloTracker.org) - Version 1.0.6 (2024/04/04)" width="1440" height="810" loading="lazy" decoding="async"></p>
          <ul>
            <li>Added Achievement Guide for &ldquo;Balaho&rsquo;s Most Wanted&rdquo;, &ldquo;Where Am I?&rdquo;, &ldquo;The One Percent and "Spoilsport&rdquo; in Halo MCC</li>
            <li>Improved Achievement Filters</li>
            <li>Improved UI for &ldquo;404 Page Not Found&rdquo; page</li>
            <li>Improved Layout on Achievement Page for large displays</li>
          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.5 (2024/04/03)</h2>
          <p><img src="assets/release-notes/v1-0-5-home.webp" alt="Home Page for Halo Achievement Tracker (HaloTracker.org) - Version 1.0.5 (2024/04/03)" width="1440" height="810" loading="lazy" decoding="async"></p>
          <ul>
            <li>Added Achievement Guide for &ldquo;Your Journey Begins&rdquo; and &ldquo;Just Getting Started&rdquo; in Halo MCC</li>
            <li>New &ldquo;The Yappening II&rdquo; background image for the home page</li>
          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.4 (2024/04/02)</h2>
          <ul>
            <li>Added Achievement Guide for &ldquo;No Picnic&rdquo; in Halo MCC</li>
            <li>The Left Hamburger Menu will now have the correct item selected on the first-page load</li>
            <li>Optimized Achievements Loading</li>
          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.3 (2024/03/17)</h2>
          <p><img src="assets/release-notes/v1-0-3-guide.webp" alt="Achievement Guide for Halo Achievement Tracker (HaloTracker.org) - Version 1.0.3 (2024/03/17)" width="1440" height="810" loading="lazy" decoding="async"></p>

          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.2 (2024/03/09)</h2>
          <ul>
            <li>Better Mobile Support</li>
            <li>Improved Achievement Filter Criteria</li>
            <li>Fixed some incorrect Achievement descriptions</li>
          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.1 (2024/03/08)</h2>
          <p><img src="assets/release-notes/v1-0-1-home.webp" alt="Home Page for Halo Achievement Tracker (HaloTracker.org) - Version 1.0.1 (2024/03/08)" width="1440" height="810" loading="lazy" decoding="async"></p>
          <ul>
            <li>Better Mobile Support</li>
            <li>Changed &ldquo;Home&rdquo; icon in the left menu</li>
          </ul>
        </section>
        <section class="release-entry surface">
          <h2>Version 1.0.0 (2024/03/07)</h2>
          <p><img src="assets/release-notes/v1-0-0-home.webp" alt="Home Page for Halo Achievement Tracker (HaloTracker.org) - Version 1.0.0 (2024/03/07)" width="1440" height="810" loading="lazy" decoding="async">
          <img src="assets/release-notes/v1-0-0-achievements.webp" alt="Achievements Page for Halo Achievement Tracker (HaloTracker.org) - Version 1.0.0 (2024/03/07)" width="1440" height="810" loading="lazy" decoding="async">
          This is the first version of the website. The first version is quite basic and barebone with only the ability to view achievements.</p>
          <ul>
            <li>View Achievements for Halo: The Master Chief Collection</li>
            <li>View Achievements for Halo 5: Guardians</li>
            <li>View Achievements for Halo Infinite</li>
            <li>View Percentage of players that have achieved an achievement</li>
            <li>Basic Achievement Filtering based on Campaign, Co-op Campaign, Multiplayer, and Other (Not Filtered Yet)</li>
          </ul>
        </section>
      </section>
    </template>

    <dialog class="guide-dialog" id="guide-dialog" aria-labelledby="guide-title">
      <button class="dialog-close" id="guide-close" type="button" autofocus aria-label="Close guide">
        <span aria-hidden="true">&times;</span>
      </button>
      <div id="guide-content"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript-message">JavaScript is required to use the Halo Achievement Tracker.</p>
    </noscript>
  </body>
</html>
